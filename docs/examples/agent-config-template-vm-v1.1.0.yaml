---
name: vm-v1.1.0-default
description: 基于 v1.1.0 二进制探针部署包默认配置生成，包含 5 个可配置组件和 7 个配置文件；preload 使用默认 SkyWalking 配置，日志采集配置仅在日志采集页管理。
clusterType: vm
variables:
- name: APO_APP_RED_TRACE_ENABLED
  defaultValue: "true"
  validationRegex: "^(true|false)$"
- name: APO_PROXY_IP
  required: true
  validationRegex: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
- name: CLUSTER_ID
  required: true
- name: HOST_IP
  required: true
  validationRegex: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
configs:
- probeType: node-agent
  files:
  - path: config.yaml
    template: |
      metric:
        ping_span: 5
        pid_span: 1
        lru_cache_size: 50000
        process_time: true

      whitelist:
        process_type: [java, python, node]
        k8s_namespace: [go-auto, default]

      k8s_metadata:
        fetch_source_addr: ""
        auth_type:
        kube_config:

      middleware_port:
        rabbitmq: [5672]
        kafka: [9092]
        activemq: [61616]
        rocketmq: [10911]
        mysql: [3306]
        postgresql: [5432]
        mongodb: [27017]
- probeType: alloy
  files:
  - path: config.alloy
    template: |
      logging {
        level  = "info"
        format = "logfmt"
      }
      prometheus.exporter.unix "local_system" {
      }

      prometheus.exporter.process "local_process" {
        procfs_path      = "/proc"
        track_threads    = false
        track_children   = false
        gather_smaps     = false
        minimal_metrics  = true
        matcher {
          comm = ["java"]
          name = "{{.Comm}}:{{.PID}}"
        }
      }
- probeType: ebpf-agent
  files:
  - path: config/camera-agent-config.yml
    template: |
      analyzers:
        cpuanalyzer:
          # segment_size defines how many segments(seconds) can be cached to wait for sending.
          # The elder segments will be overwritten by the newer ones, so don't set it too low.
          segment_size: 40
          # edge_events_window_size is the size of the duration window that seats the edge events.
          # The unit is second. The greater it is, the more data will be stored.
          edge_events_window_size: 2
          # enable_thread_cpu_metrics is the switch for whether to collect thread-level polaris metrics.
          # It dosn't rely on trigger signals like tracing txin/txout.
          enable_thread_polaris_metrics: true
        traceidanalyzer:
          # open_java_trace_sampling is the switch for whether to use Java-Trace to trigger sampling.
          open_java_trace_sampling: true
          # Set Slow Time Threshold(ms).
          java_trace_slow_time: 100
          # Set the max wait time(s) for traceId.
          java_trace_wait_second: 300
          # 是否生成RED指标.
          enable_app_red_metrics: {% APO_APP_RED_TRACE_ENABLED %}
          enable_sql_red_metrics: false
      processors:
        app_processor_enable: true
        sampleprocessor:
          enable: {% APO_APP_RED_TRACE_ENABLED %}
          # 是否将hasException数据打标为Error，默认关闭.
          exception_as_error: true
          # Options: ["tailbase", "single"].
          sampler: tailbase
          # Collect one normal sample trace between [0 ~ N] seconds window. If set 0, normal trace will not collect.
          # 展示窗口时间，即每N秒内采集一条正常Trace数据.
          display_window: 300
          # 是否入口全链路采样. If set false, 每个正常节点都会通知其他节点全链路采集.
          normal_top_sample: false
          # 同一URL正常全链路采样周期，被错慢正常链路采样后动态更新该值. If set 0, 正常全链路数据不会采样.
          normal_sample_wait_time: 60
          # open_slow_sampling is the switch for whether to collect slow traces.
          # 提供慢请求采样开关，关闭则不采集慢请求
          open_slow_sampling: true
          # open_error_sampling is the switch for whether to collect error trace for diff.
          open_error_sampling: true
          # 是否开启保存全链路profiling数据，仅对慢链路有效，默认为false
          enable_tail_base_profiling: true
          # sample_trace_repeat_num is the times of recheck trace is sampled.
          sample_trace_repeat_num: 5
          # Set the max wait time for sampled traceIds.
          sample_trace_wait_time: 60
          # Ignore trace whose duration is less than the threshold(ms).
          sample_trace_ignore_threshold: 2
          # Set period for save trace after hit same url.
          # 同一URL的静默窗口期 (原参数为sample_url_hit_duration).
          silent_period: 15
          # Set counts for save trace after hit same url.
          # 设置静默窗口期内最大采样的次数.
          silent_count: 1
          # Options: ["window", "wait"].
          silent_mode: window
          # Set the query interval(s) for get sampled traceids.
          query_profile_interval: 2
          # Set the query interval(s) for update slow threshold.
          query_slow_threshold_interval: 30
      # formerly named Receiver
      controller:
        # enable the controller to receive configuration.
        enable: true
        host: {% APO_PROXY_IP %}
        port: 30044
        # whether to fetch ebpf file from controller.
        enable_fetch_ebpf_file: true
        # Connect center API server via HTTP if true, otherwise connect receiver via gRPC.
        center_direct: false
      exporters:
        cameraexporter:
          # Options: ["elasticsearch", "grpc", "file", "noop"]
          storage: grpc
          es_config:
            es_host: http://elasticsearch-master:9200
            index_suffix: originx
          file_config:
            storage_path: /tmp/kindling/data/
            max_file_count_each_process: 50
        metricexporter:
          # Options: ["log", "prometheus"]
          type: prometheus
          prometheus:
            # victoria metrics or prometheus histogram. Options: ["pm", "vm"]
            format: vm
            port: 9500
            cache_size: 5000
            open_profiling_bucket: true
      notifier:
        enable: false
      profiler:
        # 转发profiler探针端口号，设置为0则不通知.
        port: 19005
        timeout: 2
  - path: config/log4rs.yml
    template: |
      refresh_rate: 30 seconds
      appenders:
        stdout:
          kind: console
        file:
          kind: file
          path: "log/originx-agent.log"
          encoder:
            pattern: "{d} - {m}{n}"
      root:
        level: info
        appenders:
          - stdout
          - file
      loggers:
        camera_agent::cpu_analyzer:
          level: info
  - path: load-env.sh
    template: |-
      #!/bin/bash
      export LD_LIBRARY_PATH=./libso/:${LD_LIBRARY_PATH:-}
      export CACHE_SECOND="${CACHE_SECOND:-30}"
      export ASYNC_PROFILER_PARAMS="${ASYNC_PROFILER_PARAMS:--e traceid -o sw_otel}"
      export all_north_star="${all_north_star:-true}"
      export switch_agg_num="${switch_agg_num:-2}"
      export SNAPLEN="${SNAPLEN:-1000}"
      export SYSDIG_HOST_ROOT="${SYSDIG_HOST_ROOT:-/}"
      export HOST_PROC="${HOST_PROC:-/proc}"
      export RUST_BACKTRACE="${RUST_BACKTRACE:-full}"
- probeType: vmagent
  files:
  - path: config/vmagent/scrape.yml
    template: |-
      scrape_configs:
      - job_name: apo-one-agent
        scrape_interval: 30s
        static_configs:
          - targets: ["localhost:8429","localhost:9499","localhost:9408"]
            labels:
              cluster_id: "{% CLUSTER_ID %}"
        relabel_configs:
          - action: replace
            source_labels: ["instance"]
            target_label: "instance_name"
          - action: replace
            source_labels: ["job"]
            target_label: "job_name"

      - job_name: integrations/unix
        scrape_interval: 30s
        static_configs:
          - targets: ["%{VM_MY_NODE_IP}:12345/api/v0/component/prometheus.exporter.unix.local_system/metrics"]
            labels:
              cluster_id: "{% CLUSTER_ID %}"
              instance_name: "%{VM_HOSTNAME}"
        metric_relabel_configs:
          - action: replace
            source_labels: ["job"]
            target_label: "job_name"

      - job_name: integrations/process
        scrape_interval: 60s
        scrape_timeout: 30s
        static_configs:
          - targets: ["%{VM_MY_NODE_IP}:12345/api/v0/component/prometheus.exporter.process.local_process/metrics"]
            labels:
              cluster_id: "{% CLUSTER_ID %}"
              instance_name: "%{VM_HOSTNAME}"
        metric_relabel_configs:
          - action: replace
            source_labels: ["job"]
            target_label: "job_name"
          - action: replace
            source_labels: [groupname]
            regex: '^(.*):([0-9]+)$'
            target_label: comm
            replacement: '$1'
          - action: replace
            source_labels: [groupname]
            regex: '^(.*):([0-9]+)$'
            target_label: pid
            replacement: '$2'
- probeType: preload
  files:
  - path: libapoinstrument.conf
    template: |
      [java]
      SW_AGENT_NAME={{APO_AUTO_SERVICE_NAME}}
      SW_AGENT_COLLECTOR_BACKEND_SERVICES={% HOST_IP %}:11800
      JAVA_TOOL_OPTIONS=-javaagent:/etc/apo/instrumentations/skywalking/java/skywalking-agent.jar
      JAVA_OPTS=-javaagent:/etc/apo/instrumentations/skywalking/java/skywalking-agent.jar
      SW_LOGGING_OUTPUT=CONSOLE
      SW_LOGGING_DIR=/opt/skywalking/logs

      [nodejs]
      OTEL_SERVICE_NAME = {{APO_AUTO_SERVICE_NAME}}
      OTEL_EXPORTER_OTEL_ENDPOINT = http://{% HOST_IP %}:4317
      NODE_OPTIONS = --require /etc/apo/instrumentations/nodejs/autoinstrumentation.js

      [python]
      OTEL_SERVICE_NAME = {{APO_AUTO_SERVICE_NAME}}
      OTEL_EXPORTER_OTLP_ENDPOINT = http://{% HOST_IP %}:4318
      PYTHONPATH = /etc/apo/instrumentations/python:/etc/apo/instrumentations/python/opentelemetry/instrumentation/auto_instrumentation
      OTEL_TRACES_EXPORTER = otlp
      OTEL_METRICS_EXPORTER = otlp
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL = http/protobuf
      OTEL_EXPORTER_OTLP_METRICS_PROTOCOL = http/protobuf
      OTEL_PYTHON_LOG_CORRELATION = true

      [dotnet]
      OTEL_SERVICE_NAME = {{APO_AUTO_SERVICE_NAME}}
      OTEL_EXPORTER_OTLP_ENDPOINT = http://{% HOST_IP %}:4318
      CORECLR_PROFILER = {918728DD-259F-4A6A-AC2B-B85E1B658318}
      CORECLR_ENABLE_PROFILING = 1
      CORECLR_PROFILER_PATH = /etc/apo/instrumentations/dotnet/OpenTelemetry.AutoInstrumentation.ClrProfiler.Native.so
      OTEL_TRACES_EXPORTER = otlp
      DOTNET_STARTUP_HOOKS = /etc/apo/instrumentations/dotnet/net/OpenTelemetry.AutoInstrumentation.StartupHook.dll
      DOTNET_ADDITIONAL_DEPS = /etc/apo/instrumentations/dotnet/AdditionalDeps
      DOTNET_SHARED_STORE = /etc/apo/instrumentations/dotnet/store

      [basename-blacklist]
      full=["java -version"]

      [cmdline-blacklist]
      include=['sh -c java','kafka.Kafka','zookeeper.server','bootstrap.Elasticsearch','apache.activemq','kafka.admin']
