stages:
# List of stages for jobs, and their order of execution
- build
- push-image
- deploy

variables:
  HARBOR_IMAGE_REPO: 192.168.1.22:81/kindling/apo-backend-ee
  DOCKERHUB_IMAGE_REPO: registry.cn-hangzhou.aliyuncs.com/kindlingx/apo-backend-ee
  DEPLOYMENT_NAME: apo-backend-ee
  CONTAINER_NAME: apo-backend-ee
  DIR_NAME: backend

build:
  # This job runs in the build stage, which runs first.
  stage: build
  rules:
  - if: '$CI_COMMIT_BRANCH == "enterprise"'
  script:
  - DATE=$(date +"%Y%m%d%H%M%S%Z")
  - |
    if [[ -z "$TAG" ]]; then
      TAG_NAME="$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA-$DATE"
    else
      TAG_NAME=$TAG
    fi
  - echo "TAG_NAME=$TAG_NAME" > build.env
  - docker build --build-arg PMODULE_HOST=192.168.1.22 --build-arg ACCESS="gitlab-ci-token:$CI_JOB_TOKEN" -t $HARBOR_IMAGE_REPO:$TAG_NAME ./$DIR_NAME
  artifacts:
    reports:
      dotenv: build.env

manual_build:
  stage: build
  rules:
  - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "enterprise"'
    when: manual
  script:
  - DATE=$(date +"%Y%m%d%H%M%S%Z")
  - TAG_NAME="$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA-$DATE"
  - echo "TAG_NAME=$TAG_NAME" > build.env
  - docker build --build-arg PMODULE_HOST=192.168.1.22 --build-arg ACCESS="gitlab-ci-token:$CI_JOB_TOKEN" -t $HARBOR_IMAGE_REPO:$TAG_NAME ./$DIR_NAME
  artifacts:
    reports:
      dotenv: build.env

push_local:
  stage: push-image
  script:
  - echo "TAG_NAME=$TAG_NAME"
  - echo $HARBOR_REGISTRY_PASSWORD | docker login -u $HARBOR_REGISTRY_USER --password-stdin 192.168.1.22:81
  - docker push $HARBOR_IMAGE_REPO:$TAG_NAME
  - docker rmi $HARBOR_IMAGE_REPO:$TAG_NAME

deploy-dev:
  stage: deploy
  image: 192.168.1.22:81/kindling/kubectl-cmd:latest
  rules:
  - if: '$CI_COMMIT_BRANCH == "enterprise"'
  script:
  - echo "TAG_NAME=$TAG_NAME"
  - echo "kubeconfig path is $KUBE_CONFIG_6"
  - export KUBECONFIG=$KUBE_CONFIG_6
  - kubectl -n apo set image deployment/$DEPLOYMENT_NAME $CONTAINER_NAME=$HARBOR_IMAGE_REPO:$TAG_NAME
  environment:
    name: dev
