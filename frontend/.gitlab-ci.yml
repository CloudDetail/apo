stages:
# List of stages for jobs, and their order of execution
- build
- deploy

variables:
  HARBOR_IMAGE_REPO: 192.168.1.22:81/kindling/apo-front-ee
  DOCKERHUB_IMAGE_REPO: registry.cn-hangzhou.aliyuncs.com/kindlingx/apo-front-ee
  DEPLOYMENT_NAME: apo-front-ee
  CONTAINER_NAME: apo-front-ee
  DIR_NAME: frontend
  DOCKER_BUILD_ARGS: ""
  FRONTEND_NODE_IMAGE: 192.168.1.22:81/kindling/node:22.19.0-bookworm
  FRONTEND_YARN_CACHE_DIR: /home/gitlab-runner/.cache/apo-front-yarn
  FRONTEND_NODE_MODULES_DIR: /home/gitlab-runner/.cache/apo-front-node-modules

build:
  # This job runs in the build stage, which runs first.
  stage: build
  tags:
  - general
  rules:
  - if: '$CI_COMMIT_BRANCH == "enterprise"'
  - if: '$CI_COMMIT_BRANCH == "feat/agent-menus"'
  script:
  - DATE=$(date +"%Y%m%d%H%M%S%Z")
  - |
    if [[ -z "$TAG" ]]; then
      TAG_NAME="$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA-$DATE"
    else
      TAG_NAME=$TAG
    fi
  - echo "TAG_NAME=$TAG_NAME" > build.env
  - echo "DOCKER_BUILD_ARGS=$DOCKER_BUILD_ARGS"
  - mkdir -p "$FRONTEND_YARN_CACHE_DIR" "$FRONTEND_NODE_MODULES_DIR"
  - |
    docker run --rm \
      -e NODE_OPTIONS="--openssl-legacy-provider --max-old-space-size=6144" \
      -e VITE_PUBLIC_POSTHOG_HOST="$VITE_PUBLIC_POSTHOG_HOST" \
      -e VITE_PUBLIC_POSTHOG_KEY="$VITE_PUBLIC_POSTHOG_KEY" \
      -e VITE_SHOW_MYSQL_HEALTH="$VITE_SHOW_MYSQL_HEALTH" \
      -v "$PWD/$DIR_NAME:/app" \
      -v "$FRONTEND_YARN_CACHE_DIR:/usr/local/share/.cache/yarn" \
      -v "$FRONTEND_NODE_MODULES_DIR:/app/node_modules" \
      -w /app \
      "$FRONTEND_NODE_IMAGE" \
      sh -lc '
        set -e
        tmp_lock=$(mktemp)
        cp yarn.lock "$tmp_lock"
        trap '"'"'cp "$tmp_lock" yarn.lock; rm -f "$tmp_lock"'"'"' EXIT
        yarn config set registry https://registry.npmmirror.com
        yarn config set network-timeout 600000
        yarn config set network-concurrency 8
        yarn config set cache-folder /usr/local/share/.cache/yarn
        sed -i "s|https://registry.yarnpkg.com|https://registry.npmmirror.com|g" yarn.lock
        sed -i "s|https://registry.npmjs.org|https://registry.npmmirror.com|g" yarn.lock
        yarn install --frozen-lockfile --network-timeout 600000 --network-concurrency 8 --cache-folder /usr/local/share/.cache/yarn
        yarn build
      '
  - |
    docker build $DOCKER_BUILD_ARGS \
      -f ./$DIR_NAME/Dockerfile.runtime \
      -t $HARBOR_IMAGE_REPO:$TAG_NAME ./$DIR_NAME
  - echo $HARBOR_REGISTRY_PASSWORD | docker login -u $HARBOR_REGISTRY_USER --password-stdin 192.168.1.22:81
  - docker push $HARBOR_IMAGE_REPO:$TAG_NAME
  - docker rmi $HARBOR_IMAGE_REPO:$TAG_NAME
  artifacts:
    reports:
      dotenv: build.env

manual_build:
  stage: build
  tags:
  - general
  rules:
  - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "enterprise" && $CI_COMMIT_BRANCH != "feat/agent-menus"'
    when: manual
  script:
  - DATE=$(date +"%Y%m%d%H%M%S%Z")
  - TAG_NAME="$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA-$DATE"
  - echo "TAG_NAME=$TAG_NAME" > build.env
  - mkdir -p "$FRONTEND_YARN_CACHE_DIR" "$FRONTEND_NODE_MODULES_DIR"
  - |
    docker run --rm \
      -e NODE_OPTIONS="--openssl-legacy-provider --max-old-space-size=6144" \
      -e VITE_PUBLIC_POSTHOG_HOST="$VITE_PUBLIC_POSTHOG_HOST" \
      -e VITE_PUBLIC_POSTHOG_KEY="$VITE_PUBLIC_POSTHOG_KEY" \
      -e VITE_SHOW_MYSQL_HEALTH="$VITE_SHOW_MYSQL_HEALTH" \
      -v "$PWD/$DIR_NAME:/app" \
      -v "$FRONTEND_YARN_CACHE_DIR:/usr/local/share/.cache/yarn" \
      -v "$FRONTEND_NODE_MODULES_DIR:/app/node_modules" \
      -w /app \
      "$FRONTEND_NODE_IMAGE" \
      sh -lc '
        set -e
        tmp_lock=$(mktemp)
        cp yarn.lock "$tmp_lock"
        trap '"'"'cp "$tmp_lock" yarn.lock; rm -f "$tmp_lock"'"'"' EXIT
        yarn config set registry https://registry.npmmirror.com
        yarn config set network-timeout 600000
        yarn config set network-concurrency 8
        yarn config set cache-folder /usr/local/share/.cache/yarn
        sed -i "s|https://registry.yarnpkg.com|https://registry.npmmirror.com|g" yarn.lock
        sed -i "s|https://registry.npmjs.org|https://registry.npmmirror.com|g" yarn.lock
        yarn install --frozen-lockfile --network-timeout 600000 --network-concurrency 8 --cache-folder /usr/local/share/.cache/yarn
        yarn build
      '
  - |
    docker build $DOCKER_BUILD_ARGS \
      -f ./$DIR_NAME/Dockerfile.runtime \
      -t $HARBOR_IMAGE_REPO:$TAG_NAME ./$DIR_NAME
  - echo $HARBOR_REGISTRY_PASSWORD | docker login -u $HARBOR_REGISTRY_USER --password-stdin 192.168.1.22:81
  - docker push $HARBOR_IMAGE_REPO:$TAG_NAME
  - docker rmi $HARBOR_IMAGE_REPO:$TAG_NAME
  artifacts:
    reports:
      dotenv: build.env

deploy-dev:
  stage: deploy
  image: 192.168.1.22:81/kindling/kubectl-cmd:latest
  rules:
  - if: '$CI_COMMIT_BRANCH == "enterprise"'
  - if: '$CI_COMMIT_BRANCH == "feat/agent-menus"'
  script:
  - echo "TAG_NAME=$TAG_NAME"
  - echo "kubeconfig path is $KUBE_CONFIG_6"
  - export KUBECONFIG=$KUBE_CONFIG_6
  - kubectl -n apo set image deployment/$DEPLOYMENT_NAME $CONTAINER_NAME=$HARBOR_IMAGE_REPO:$TAG_NAME
  environment:
    name: dev
