stages: # List of stages for jobs, and their order of execution
- build
- push-image
- deploy

variables:
  HARBOR_IMAGE_REPO: 192.168.1.22:81/kindling/apo-front-ee
  DOCKERHUB_IMAGE_REPO: registry.cn-hangzhou.aliyuncs.com/kindlingx/apo-front-ee
  DEPLOYMENT_NAME: apo-front-ee
  CONTAINER_NAME: apo-front-ee
  DIR_NAME: frontend
  DOCKER_BUILD_ARGS: ""

build: # This job runs in the build stage, which runs first.
  stage: build
  rules:
  - if: '$CI_COMMIT_BRANCH == "enterprise"'
  script:
  - DATE=$(date +"%Y%m%d%H%M%S%Z")
  - TAG_NAME="$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA-$DATE"
  - echo "TAG_NAME=$TAG_NAME" > build.env
  - echo "DOCKER_BUILD_ARGS=$DOCKER_BUILD_ARGS"
  - |
    docker build $DOCKER_BUILD_ARGS \
      --build-arg VITE_PUBLIC_POSTHOG_HOST=$VITE_PUBLIC_POSTHOG_HOST \
      --build-arg VITE_PUBLIC_POSTHOG_KEY=$VITE_PUBLIC_POSTHOG_KEY \
      -t $HARBOR_IMAGE_REPO:$TAG_NAME ./$DIR_NAME
  artifacts:
    reports:
      dotenv: build.env

manual_build:
  stage: build
  rules:
  - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "enterprise"'
    when: manual
  script:
  - DATE=$(date +"%Y%m%d%H%M%S%Z")
  - TAG_NAME="$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA-$DATE"
  - echo "TAG_NAME=$TAG_NAME" > build.env
  - |
    docker build $DOCKER_BUILD_ARGS \
      --build-arg VITE_PUBLIC_POSTHOG_HOST=$VITE_PUBLIC_POSTHOG_HOST \
      --build-arg VITE_PUBLIC_POSTHOG_KEY=$VITE_PUBLIC_POSTHOG_KEY \
      -t $HARBOR_IMAGE_REPO:$TAG_NAME ./$DIR_NAME
  artifacts:
    reports:
      dotenv: build.env

push_local:
  stage: push-image
  script:
  - echo "TAG_NAME=$TAG_NAME"
  - echo $HARBOR_REGISTRY_PASSWORD | docker login -u $HARBOR_REGISTRY_USER --password-stdin 192.168.1.22:81
  - docker push $HARBOR_IMAGE_REPO:$TAG_NAME

deploy-dev:
  stage: deploy
  image: 192.168.1.22:81/kindling/kubectl-cmd:latest
  rules:
  - if: '$CI_COMMIT_BRANCH == "enterprise"'
  script:
  - echo "TAG_NAME=$TAG_NAME"
  - echo "kubeconfig path is $KUBE_CONFIG_6"
  - export KUBECONFIG=$KUBE_CONFIG_6
  - kubectl -n apo set image deployment/$DEPLOYMENT_NAME $CONTAINER_NAME=$HARBOR_IMAGE_REPO:$TAG_NAME
  environment:
    name: dev