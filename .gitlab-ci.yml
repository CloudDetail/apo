stages:
  - triggers

trigger_backend:
  stage: triggers
  trigger:
    include: backend/.gitlab-ci.yml
  rules:
    - if: '$CI_COMMIT_BRANCH == "enterprise"'
      changes:
      - backend/**/*

trigger_frontend:
  stage: triggers
  trigger:
    include: frontend/.gitlab-ci.yml
  rules:
    - if: '$CI_COMMIT_BRANCH == "enterprise"'
      changes:
      - frontend/**/*