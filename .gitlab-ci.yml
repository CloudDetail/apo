stages:
  - triggers

variables: 
  DOCKER_BUILD_ARGS: ""
  BUILD_ARCH: "amd64"
  
trigger_backend:
  stage: triggers
  trigger:
    include: backend/.gitlab-ci.yml
  rules:
    - if: '$CI_COMMIT_BRANCH == "enterprise"'
      changes:
      - backend/**/*

trigger_frontend:
  stage: triggers
  variables: 
    DOCKER_BUILD_ARGS: $DOCKER_BUILD_ARGS
  trigger:
    include: frontend/.gitlab-ci.yml
  rules:
    - if: '$CI_COMMIT_BRANCH == "enterprise"'
      changes:
      - frontend/**/*

manual_trigger_backend:
  stage: triggers
  trigger:
    include: backend/.gitlab-ci.yml
  rules:
    - if: '$CI_COMMIT_BRANCH != "enterprise" && $BUILD_ARCH == "amd64"'
      when: manual
      changes:
      - backend/**/*

manual_trigger_frontend:
  stage: triggers
  variables: 
    DOCKER_BUILD_ARGS: $DOCKER_BUILD_ARGS
  trigger:
    include: frontend/.gitlab-ci.yml
  rules:
    - if: '$CI_COMMIT_BRANCH != "enterprise" && $BUILD_ARCH == "amd64"'
      when: manual
      changes:
      - frontend/**/*

manual_trigger_backend_arm:
  stage: triggers
  trigger:
    include: backend/.gitlab-arm-ci.yml
  rules:
    - if: '$CI_COMMIT_BRANCH && $BUILD_ARCH == "arm"'
      when: manual
      changes:
      - backend/**/*


manual_trigger_frontend_arm:
  stage: triggers
  variables: 
    DOCKER_BUILD_ARGS: $DOCKER_BUILD_ARGS
  trigger:
    include: frontend/.gitlab-arm-ci.yml
  rules:
    - if: '$CI_COMMIT_BRANCH && $BUILD_ARCH == "arm"'
      when: manual
      changes:
      - frontend/**/*