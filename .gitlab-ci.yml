stages:
- triggers
- release

variables:
  DOCKER_BUILD_ARGS: ""
  BUILD_ARCH: "amd64"

trigger_backend:
  stage: triggers
  trigger:
    include: backend/.gitlab-ci.yml
  rules:
  - if: $CI_COMMIT_BRANCH == "enterprise" && $CI_PIPELINE_SOURCE != "trigger"
    changes:
    - backend/**/*

trigger_frontend:
  stage: triggers
  variables:
    DOCKER_BUILD_ARGS: $DOCKER_BUILD_ARGS
  trigger:
    include: frontend/.gitlab-ci.yml
  rules:
  - if: $CI_COMMIT_BRANCH == "enterprise" && $CI_PIPELINE_SOURCE != "trigger"
    changes:
    - frontend/**/*

manual_trigger_backend:
  stage: triggers
  trigger:
    include: backend/.gitlab-ci.yml
  rules:
  - if: '$CI_COMMIT_BRANCH != "enterprise" && $BUILD_ARCH == "amd64"'
    when: manual
    changes:
    - backend/**/*

manual_trigger_frontend:
  stage: triggers
  variables:
    DOCKER_BUILD_ARGS: $DOCKER_BUILD_ARGS
  trigger:
    include: frontend/.gitlab-ci.yml
  rules:
  - if: '$CI_COMMIT_BRANCH != "enterprise" && $BUILD_ARCH == "amd64"'
    when: manual
    changes:
    - frontend/**/*

manual_trigger_backend_arm:
  stage: triggers
  trigger:
    include: backend/.gitlab-arm-ci.yml
  rules:
  - if: '$CI_COMMIT_BRANCH && $BUILD_ARCH == "arm"'
    when: manual
    changes:
    - backend/**/*

manual_trigger_frontend_arm:
  stage: triggers
  variables:
    DOCKER_BUILD_ARGS: $DOCKER_BUILD_ARGS
  trigger:
    include: frontend/.gitlab-arm-ci.yml
  rules:
  - if: '$CI_COMMIT_BRANCH && $BUILD_ARCH == "arm"'
    when: manual
    changes:
    - frontend/**/*

trigger_build:
  stage: triggers
  # 触发规则改成外部触发器触发，并接收"TAG"变量
  rules:
  - if: $CI_PIPELINE_SOURCE == "trigger" && $TAG
  trigger:
    include:
    - local: backend/.gitlab-ci.yml
    strategy: depend

build_artifact:
  stage: release
  rules:
  - if: $CI_PIPELINE_SOURCE == "trigger" && $TAG
  script:
  - echo "版本发布就绪 $TAG"
  release:
    name: "$TAG"
    tag_name: "$TAG"
    description: "test"
