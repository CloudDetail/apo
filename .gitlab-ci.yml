stages:
  - triggers

variables: 
  VITE_SHOW_MYSQL_HEALTH: ""
  DOCKER_BUILD_ARGS: ""
  
trigger_backend:
  stage: triggers
  trigger:
    include: backend/.gitlab-ci.yml
  rules:
    - if: '$CI_COMMIT_BRANCH == "enterprise"'
      changes:
      - backend/**/*

trigger_frontend:
  stage: triggers
  variables: 
    VITE_SHOW_MYSQL_HEALTH: $VITE_SHOW_MYSQL_HEALTH
    DOCKER_BUILD_ARGS: $DOCKER_BUILD_ARGS
  trigger:
    include: frontend/.gitlab-ci.yml
  rules:
    - if: '$CI_COMMIT_BRANCH == "enterprise"'
      changes:
      - frontend/**/*

manual_trigger_backend:
  stage: triggers
  trigger:
    include: backend/.gitlab-ci.yml
  rules:
    - if: '$CI_COMMIT_BRANCH != "enterprise"'
      when: manual
      changes:
      - backend/**/*

manual_trigger_frontend:
  stage: triggers
  variables: 
    VITE_SHOW_MYSQL_HEALTH: $VITE_SHOW_MYSQL_HEALTH
    DOCKER_BUILD_ARGS: $DOCKER_BUILD_ARGS
  trigger:
    include: frontend/.gitlab-ci.yml
  rules:
    - if: '$CI_COMMIT_BRANCH != "enterprise"'
      when: manual
      changes:
      - frontend/**/*
